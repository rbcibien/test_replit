
{% extends "base.html" %}

{% block title %}Invite People - {{ event.name }}{% endblock %}

{% block content %}
<h1>Invite People to {{ event.name }}</h1>

<div class="event-card">
    <p><strong>Event:</strong> {{ event.name }}</p>
    <p><strong>Date:</strong> {{ event.schedule.strftime('%B %d, %Y at %I:%M %p') }}</p>
    <p><strong>Location:</strong> {{ event.location }}</p>
</div>

<h2>Add New Invitee</h2>

<form method="POST">
    <div class="form-group">
        <label for="invitee_name">Invitee Name:</label>
        <input type="text" id="invitee_name" name="invitee_name" required>
    </div>
    
    <div class="form-group">
        <label for="invitee_email">Invitee Email:</label>
        <input type="email" id="invitee_email" name="invitee_email" required>
    </div>
    
    <button type="submit">Create Invitation</button>
</form>

<div style="margin-top: 20px;">
    <a href="{{ url_for('event_details', event_id=event.id) }}">
        <button style="background-color: #6c757d;">Back to Event Details</button>
    </a>
</div>
{% endblock %}
